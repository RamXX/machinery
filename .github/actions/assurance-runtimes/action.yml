# assurance-runtimes - the exact runtime identities the assurance catalog pins.
#
# One owner for every job that executes the required integration lane or the
# native test suite: the lane verifies each identity against these pins before
# any suite runs and fails closed on any other version, so a job that installs
# a different set (or only Go from go.mod) cannot pass. go.mod is only the
# module's floor; the catalog pin is exact.
name: assurance runtimes
description: Install Go 1.27.4, Node 26.13.1 with TypeScript 7.0.2, CPython 3.15.2, and Elixir 1.20.5 on OTP 29.1.3
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: "1.27.4"
        cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.15.2
    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: 1.20.5
        otp-version: 29.1.3
    - name: Install the pinned TypeScript compiler
      run: npm install -g typescript@7.0.2
      shell: bash

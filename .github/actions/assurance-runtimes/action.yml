# assurance-runtimes - the exact runtime identities the assurance catalog pins.
#
# One owner for every job that executes the required integration lane or the
# native test suite: the lane verifies each identity against these pins before
# any suite runs and fails closed on any other version, so a job that installs
# a different set (or only Go from go.mod) cannot pass. go.mod is only the
# module's floor; the catalog pin is exact.
name: assurance runtimes
description: Install Go 1.27.1, Node 26.8.1 with TypeScript 7.0.2, CPython 3.14.7, and Elixir 1.20.4 on OTP 29.0.6
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.1"
        cache: true
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.8.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.14.7
    - uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764 # v1.23.0
      with:
        elixir-version: 1.20.4
        otp-version: 29.0.6
    - name: Install the pinned TypeScript compiler
      run: npm install -g typescript@7.0.2
      shell: bash

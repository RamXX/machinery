# formal.yml: the formal_ end-to-end scripts (make formal), which run TLC and
# Alloy for real on the pinned jars. Apart from ci.yml so a model checker
# regression shows on its own badge.
name: formal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formal:
    name: formal scripts (TLC and Alloy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install the pinned tools
        run: make tools
      - name: Formal scripts
        run: make formal

# formal.yml - TLC model-checking of every generated TLA+ spec.
# Separated from ci.yml because the JVM setup is heavy and TLC is the slowest
# job (~minutes per design). Runs on push/PR but is allowed to report
# independently so a TLC regression is visible without masking faster checks.
name: formal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Cache checksum-pinned engines and the hermetically provisioned Java runtime.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/machinery
          key: machinery-engines-tla2tools-v1.7.4-java-21.0.12.1-1
      - name: Build machinery
        run: make build
      - name: Regenerate + TLC-check every registered formal example
        run: |
          set -euo pipefail
          scripts/example-inventory.sh formal | while IFS= read -r design; do
            .bin/machinery verify-formal "$design"
          done
      - name: Assert formal generation left no diff
        run: |
          status=$(go run ./scripts/git-safe -root . -- status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::formal verification regenerated tracked content or emitted an untracked artifact"
            exit 1
          fi

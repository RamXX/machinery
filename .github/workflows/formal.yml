# formal.yml - TLC model-checking of every generated TLA+ spec.
# Separated from ci.yml because the JVM setup is heavy and TLC is the slowest
# job (~minutes per design). Runs on push/PR but is allowed to report
# independently so a TLC regression is visible without masking faster checks.
name: formal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: formal verification only reads the repository.
permissions:
  contents: read

jobs:
  integration-required:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      # The lane retains its report and every evidence file of the run in one
      # directory, exported whatever the outcome, so a remote-only failure
      # stays diagnosable from what the runner kept.
      - name: Required runtime integration
        run: |
          set -euo pipefail
          dagger call integration-evidence export --path="$RUNNER_TEMP/integration-required-evidence"
          cat "$RUNNER_TEMP/integration-required-evidence/console.txt"
          test "$(cat "$RUNNER_TEMP/integration-required-evidence/exit")" = 0
      - name: Retain required integration evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-required-evidence
          path: ${{ runner.temp }}/integration-required-evidence
          if-no-files-found: warn
          retention-days: 7
  verify-formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call verify-formal

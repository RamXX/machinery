# ci.yml - the required pipeline. Every push and PR must pass this.
# Coverage: build, lint (golangci-lint + gofmt + vet), unit tests (including
# the adversarial gate-experiment suite and the golden-corpus regression net),
# the closed manifest of shipped example gate suites,
# and every registered implementation module. A single failure blocks merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every CI job reads the repository and writes nothing.
permissions:
  contents: read

jobs:
  integration-required:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      # The lane's evidence directory is exported whatever the outcome, so a
      # remote-only failure stays diagnosable from what the runner kept.
      - name: Required runtime integration
        run: |
          set -euo pipefail
          dagger call integration-evidence export --path="$RUNNER_TEMP/integration-required-evidence"
          cat "$RUNNER_TEMP/integration-required-evidence/console.txt"
          test "$(cat "$RUNNER_TEMP/integration-required-evidence/exit")" = 0
      - name: Retain required integration evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-required-evidence
          path: ${{ runner.temp }}/integration-required-evidence
          if-no-files-found: warn
          retention-days: 7
  # ---------------------------------------------------------------- build ---
  # Compile every release target and retain a Windows cross-build as an early
  # portability signal. Windows is a release build target; native windows
  # test execution remains out of scope (custody and assurance lanes are
  # unix-only and refuse honestly there).
  # Verifies CGO_DISABLED static builds work (the release pipeline depends on it).
  # Every cross-compiled target is built in one container, which also smoke-
  # tests the one target that can execute there. Darwin is built and smoke-
  # tested natively below, because no Linux container can run a darwin binary.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call build

  build-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (static, CGO disabled) on native darwin/arm64
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o machinery ./cmd/machinery
      - name: Smoke-test --version
        run: ./machinery version

  # ----------------------------------------------------------------- lint ---
  # golangci-lint (the configured linter set) + gofmt (formatting gate) +
  # go vet (the stdlib analyzer). Formatting is enforced so PRs don't drift.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call lint

  # ----------------------------------------------------------------- test ---
  # The Go unit + experiment suite (every package). This is the fast feedback
  # loop; the examples-exercising jobs run separately below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call test

  # ---------------------------------------------------------------- gates ---
  # Run the deterministic gate suite on every shipped example via the Go
  # binary. This is the dogfood: machinery checks its own reference designs.
  gates:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call gates

  # ---------------------------------------------- example impl module tests ---
  # Every registered example module has its own hermetic suite.
  example-impls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call example-impls

  # -------------------------------------------------------------- golden ---
  # The golden-corpus scoreboard, REQUIRED. The corpus under testdata/golden
  # was captured at Python parity and is now the binary's own byte-for-byte
  # regression net (stdout/stderr/exit and every generated artifact) for the
  # deterministic subcommands across the examples. An intended output change
  # re-captures with `go test ./cmd/machinery -run TestGolden -update` and
  # reviews the diff.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call golden

  # Run the same byte-for-byte corpus on native macOS. Windows remains a
  # cross-compilation signal only and is not a supported runtime target.
  golden-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Golden corpus on native ${{ runner.os }}
        run: go test -count=1 -run TestGolden ./cmd/machinery

  # Exercise confinement, rename transactions, permissions, and portable-name
  # rules on the supported native non-Linux filesystem. This also executes
  # the four-language native assurance probes on hosted darwin/arm64: exact
  # runtimes are provisioned per the closed catalog pins and verified by the
  # lane's tests; a missing or mismatched runtime fails, never skips.
  native-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/assurance-runtimes
      # The per-binary alarm mirrors the race job's 30m: without it Go's 10m
      # default fires on the slowest packages (internal/install's fsync-bound
      # suite, cmd/machinery) on the small hosted macOS VM and reports a
      # timeout, not a result. Any hung test still dies inside the job's 60m.
      - name: Full non-race suite on native macOS
        run: go test -count=1 ./... -timeout=30m

  # ------------------------------------------------------------ docs gate ---
  # The toolchain command surface is documented in six places (README, SKILL,
  # agent prompts, template, tools README, and the team guide in docs/). This
  # gate fails on any reference to the deleted Python toolchain so the surfaces
  # cannot drift apart again (the exact class of rot the Go port shipped with).
  # Historical mentions are allowed only in Go package docs; the golden corpus
  # under testdata/golden is the behavior contract.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - name: Documentation surface gate
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # github.event.before is all-zeros on the first push to a new branch,
          # and names a commit this checkout may not have after a force push.
          # Either way the aggregate change is measured against the parent.
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          dagger call docs --base-ref="$base"

  # ----------------------------------------------------------- tidy gate ---
  # go.mod / go.sum must be tidy and in sync. A stray dependency or a missing
  # go.sum entry fails here, not in a downstream consumer.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call tidy

  # ---------------------------------------------------- Modelith render ---
  # Modelith is the engine half of the domain-model phase. Regenerate every
  # committed render with the pinned engine, apply the required mechanical
  # house-style normalization, and reject any byte drift.
  modelith-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call modelith-render

  # ----------------------------------------------- external engines gate ---
  # Pure machinery gates remain dependency-free. This required job exercises
  # the two explicit engine halves: C4 grammar compilation and the reference
  # external checker. Every downloaded engine and action is version-pinned.
  design-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call design-engines

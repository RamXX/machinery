name: ci

on:
  push:
    branches: [experimental/v2]
  pull_request:
    branches: [experimental/v2]

permissions:
  contents: read

jobs:
  check:
    name: check and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install bd (the backlog tool the bridge scripts drive)
        run: go install github.com/gastownhall/beads/cmd/bd@v1.3.4
      - name: Install the pinned tools
        run: make tools
      - name: Check
        run: make check
      - name: End-to-end suite
        run: make e2e
  reference:
    name: reference project
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install the pinned tools
        run: make tools
      - name: Reference project (real Postgres in Docker)
        run: make crm

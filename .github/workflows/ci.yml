# ci.yml - the required pipeline. Every push and PR must pass this.
# Coverage: build, lint (golangci-lint + gofmt + vet), unit tests (including
# the adversarial gate-experiment suite and the golden-corpus regression net),
# the closed manifest of shipped example gate suites,
# and every registered implementation module. A single failure blocks merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- build ---
  # Compile the binary on three OSes + cross-compile for the release targets.
  # Verifies CGO_DISABLED static builds work (the release pipeline depends on it).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (static, CGO disabled)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o machinery ./cmd/machinery
      - name: Smoke-test --version
        # Cross-compiled targets cannot execute on the build runner; smoke-test
        # only the native os/arch pairs (linux/arm64 is built on an amd64 runner).
        if: ${{ !(matrix.goos == 'linux' && matrix.goarch == 'arm64') }}
        run: ./machinery version

  # ----------------------------------------------------------------- lint ---
  # golangci-lint (the configured linter set) + gofmt (formatting gate) +
  # go vet (the stdlib analyzer). Formatting is enforced so PRs don't drift.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt (formatting gate)
        run: |
          unformatted=$(gofmt -l cmd/ internal/)
          if [ -n "$unformatted" ]; then
            echo "::error::Files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Install and run pinned actionlint
        run: |
          version=$(cat .actionlint-version)
          go install github.com/rhysd/actionlint/cmd/actionlint@"$version"
          actionlint .github/workflows/*.yml
      - name: Install and run pinned ShellCheck on the closed shell corpus
        run: |
          set -euo pipefail
          version=$(cat .shellcheck-version)
          checksum=$(cat .shellcheck-linux-x86_64.sha256)
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          install_dir="$RUNNER_TEMP/shellcheck"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" -o "$archive"
          echo "$checksum  $archive" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xJf "$archive" --strip-components=1 -C "$install_dir"
          test "$("$install_dir/shellcheck" --version | awk '$1 == "version:" {print $2}')" = "$version"
          scripts/shellcheck-inventory.sh >"$RUNNER_TEMP/shellcheck-files"
          shell_files=()
          while IFS= read -r shell_file; do
            shell_files+=("$shell_file")
          done <"$RUNNER_TEMP/shellcheck-files"
          test "${#shell_files[@]}" -gt 0
          "$install_dir/shellcheck" "${shell_files[@]}"
      - name: Read pinned golangci-lint version
        id: gciv
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Uses the v2 config in .golangci.yml. The linter version is the single
          # source of truth in .golangci-version, shared with the local preflight
          # gate (make lint-install) so CI and local run the identical linter.
          # Bump that file deliberately, with the diff reviewed.
          # The action must be v7+ to accept a golangci-lint v2 version string.
          version: ${{ steps.gciv.outputs.version }}
          args: --config .golangci.yml --timeout 5m

  # ----------------------------------------------------------------- test ---
  # The Go unit + experiment suite (every package). This is the fast feedback
  # loop; the examples-exercising jobs run separately below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit + experiment tests (with race detector)
        run: go test -race -count=1 ./...

  # ---------------------------------------------------------------- gates ---
  # Run the deterministic gate suite on every shipped example via the Go
  # binary. This is the dogfood: machinery checks its own reference designs.
  gates:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build machinery
        run: make build
      - name: Gate every registered example with its exact capabilities
        run: |
          set -euo pipefail
          inventory=$(mktemp)
          trap 'rm -f "$inventory"' EXIT
          scripts/example-inventory.sh rows >"$inventory"
          while IFS=$'\t' read -r -a row; do
            design=${row[0]}
            impl=${row[1]}
            complete=${row[5]}
            args=("$design" --warnings-as-errors)
            [[ "$impl" == - ]] || args+=(--impl "$impl")
            [[ "$complete" == no ]] || args+=(--complete)
            .bin/machinery check "${args[@]}"
          done <"$inventory"

  # ---------------------------------------------- example impl module tests ---
  # Every registered example module has its own hermetic suite.
  example-impls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Registered implementation module suites
        run: |
          set -euo pipefail
          scripts/example-inventory.sh impl-modules | while IFS=$'\t' read -r design impl module; do
            case "$module" in
              go) (cd "$impl" && go test ./... -count=1) ;;
              *) echo "::error::unsupported implementation module type $module: $design"; exit 1 ;;
            esac
          done

  # -------------------------------------------------------------- golden ---
  # The golden-corpus scoreboard, REQUIRED. The corpus under testdata/golden
  # was captured at Python parity and is now the binary's own byte-for-byte
  # regression net (stdout/stderr/exit and every generated artifact) for the
  # deterministic subcommands across the examples. An intended output change
  # re-captures with `go test ./cmd/machinery -run TestGolden -update` and
  # reviews the diff.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Golden corpus (byte-for-byte, deterministic subcommands)
        run: go test -count=1 -run TestGolden ./cmd/machinery
      - name: Adversarial gate-experiment suite
        run: go test -count=1 ./internal/experiments/

  # Run the same byte-for-byte corpus on native non-Linux filesystems. This
  # catches path separator, executable suffix, newline, and directory-order
  # dependencies that a Linux-only golden job cannot see.
  golden-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Golden corpus on native ${{ runner.os }}
        run: go test -count=1 -run TestGolden ./cmd/machinery

  # Exercise confinement, rename transactions, permissions, and portable-name
  # rules on the native filesystems they protect.
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Full non-race suite on native ${{ runner.os }}
        run: go test -count=1 ./...

  # ------------------------------------------------------------ docs gate ---
  # The toolchain command surface is documented in six places (README, SKILL,
  # agent prompts, template, tools README, and the team guide in docs/). This
  # gate fails on any reference to the deleted Python toolchain so the surfaces
  # cannot drift apart again (the exact class of rot the Go port shipped with).
  # Historical mentions are allowed only in Go package docs; the golden corpus
  # under testdata/golden is the behavior contract.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: No whitespace errors in the aggregate change
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: go run ./scripts/git-safe -root . -- diff --check "$BASE_SHA..HEAD"
      - name: No stale toolchain or checker-runtime references in the doc surface
        run: |
          grep_status=0
          grep -rnE "PyYAML|pyyaml|uv run|oracle_gen\.py|machine_lint\.py|machinery_check\.py|tla_gen\.py|refine_gen\.py|compose_gen\.py|diff-all\.sh|capture-golden\.sh" \
            README.md skills/ agents/ docs/ Makefile || grep_status=$?
          case "$grep_status" in
            0) echo "::error::stale Python-toolchain reference found (the toolchain is the Go binary)"; exit 1 ;;
            1) ;;
            *) echo "::error::stale Python-toolchain scan failed with status $grep_status"; exit 1 ;;
          esac
          grep_status=0
          grep -rnEi "Souffl(e|é).*(external.checker|checker engine|CI pin|required)|external.checker.*Souffl(e|é)" \
            README.md docs/ examples/pii-flow/README.md || grep_status=$?
          case "$grep_status" in
            0) echo "::error::stale host checker-runtime contract found"; exit 1 ;;
            1) ;;
            *) echo "::error::host checker-runtime scan failed with status $grep_status"; exit 1 ;;
          esac
          echo "doc surface clean"
      # The pattern uses literal UTF-8 octets: stock macOS Bash 3.2 does not
      # decode \u escapes, and this keeps .github/ safe to scan without a
      # self-match.
      - name: No em dashes in the doc surface (house style)
        run: |
          grep_status=0
          em_dash=$(printf '\342\200\224')
          grep -rn "$em_dash" README.md CONTRIBUTING.md install.sh skills/ agents/ docs/ examples/ commands/ adapters/ hooks/ Makefile .github/ || grep_status=$?
          case "$grep_status" in
            0) echo "::error::em dash found; house style forbids it"; exit 1 ;;
            1) ;;
            *) echo "::error::em-dash scan failed with status $grep_status"; exit 1 ;;
          esac
          echo "no em dashes"

  # ----------------------------------------------------------- tidy gate ---
  # go.mod / go.sum must be tidy and in sync. A stray dependency or a missing
  # go.sum entry fails here, not in a downstream consumer.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy (verify clean)
        run: |
          go mod tidy
          go run ./scripts/git-safe -root . -- diff --exit-code -- go.mod go.sum

  # ---------------------------------------------------- Modelith render ---
  # Modelith is the engine half of the domain-model phase. Regenerate every
  # committed render with the pinned engine, apply the required mechanical
  # house-style normalization, and reject any byte drift.
  modelith-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Modelith v0.4.0 (pinned)
        run: go install github.com/stacklok/modelith/cmd/modelith@v0.4.0
      - name: Assert committed Modelith renders are fresh
        run: make modelith-render-check

  # ----------------------------------------------- external engines gate ---
  # Pure machinery gates remain dependency-free. This required job exercises
  # the two explicit engine halves: C4 grammar compilation and the reference
  # external checker. Every downloaded engine and action is version-pinned.
  design-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build machinery
        run: make build
      - name: Assert committed engine trust roots
        run: |
          set -euo pipefail
          test -s .java-runtime-pin
          test -s .structurizr-pin
      - name: Compile every example workspace.dsl
        run: |
          set -euo pipefail
          c4_inventory=$(mktemp)
          trap 'rm -f "$c4_inventory"' EXIT
          scripts/c4-inventory.sh examples >"$c4_inventory"
          test -s "$c4_inventory"
          while IFS= read -r dsl; do
            .bin/machinery verify-c4 "$(dirname "$dsl")"
          done <"$c4_inventory"
      - name: Provision immutable external-checker OCI runtime
        run: |
          set -euo pipefail
          command -v docker
          runner=$RUNNER_TEMP/machinery-run-safe
          runner_build_stderr=$RUNNER_TEMP/machinery-run-safe-build.stderr
          if ! go build -o "$runner" ./scripts/run-safe 2>"$runner_build_stderr"; then
            cat "$runner_build_stderr" >&2
            exit 1
          fi
          if [ -s "$runner_build_stderr" ]; then
            cat "$runner_build_stderr" >&2
            echo "::error::building bounded external-command runner emitted stderr"
            exit 1
          fi
          image=python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
          platform=linux/amd64
          pull_receipt=$("$runner" -timeout 10m -stdout-limit 4096 -stderr-limit 65536 -- \
            docker pull --quiet --platform "$platform" "$image")
          case "$pull_receipt" in
            "$image"|"docker.io/library/$image") ;;
            *) echo "::error::Docker pull returned a non-canonical image receipt: $pull_receipt"; exit 1 ;;
          esac
          inspect=$("$runner" -timeout 30s -stdout-limit 65536 -stderr-limit 4096 -- \
            docker image inspect --platform "$platform" --format '{{json .RepoDigests}} {{.Os}}/{{.Architecture}}' "$image")
          case "$inspect" in
            *\"$image\"*" $platform") ;;
            *) echo "::error::local OCI identity does not match $image on $platform: $inspect"; exit 1 ;;
          esac
          "$runner" -timeout 2m -stdout-limit 4096 -stderr-limit 4096 -- \
            docker run --rm --pull=never --platform "$platform" --network=none --read-only "$image" python3 --version
      - name: Required real OCI checker golden
        env:
          MACHINERY_REQUIRE_OCI_GOLDEN: "1"
        run: go test -count=1 -run '^TestVerifyCheckersPiiFlowEngineGolden$' ./cmd/machinery
      - name: Re-run every registered external checker
        run: |
          set -euo pipefail
          scripts/example-inventory.sh checkers | while IFS=$'\t' read -r design registry; do
            .bin/machinery verify-checkers "$design" --registry "$registry"
          done

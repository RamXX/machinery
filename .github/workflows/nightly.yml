# nightly.yml - the deep, non-blocking checks that run once a day (or on
# manual dispatch). They do not block PRs; they surface drift on a cadence so
# it cannot accumulate silently.
name: nightly

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Regenerate every committed generated artifact (oracles AND formal specs)
  # and assert an empty git diff. Silent when fresh; a diff means a committed
  # artifact is stale or a generator drifted.
  regen-clean-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Modelith v0.4.0 (pinned)
        run: go install github.com/stacklok/modelith/cmd/modelith@v0.4.0
      - name: Regenerate committed Modelith renders
        run: make modelith-render
      - name: Regenerate oracles with Go
        run: |
          set -euo pipefail
          make build
          scripts/example-inventory.sh formal | while IFS= read -r design; do
            .bin/machinery oracle "$design/machines"
          done
          scripts/example-inventory.sh pack-parents | while IFS= read -r design; do
            .bin/machinery pack generate "$design"
          done
      # verify-formal --gen-only runs the exact generator orchestration the
      # checked run uses (tla + refine + compose, coordinator parsed as YAML),
      # with TLC skipped so this job stays Java-free. The previous shell
      # reimplementation of this loop misparsed a commented coordinator line;
      # single-sourcing it in the binary is the fix.
      - name: Regenerate formal specs with Go
        run: |
          set -euo pipefail
          scripts/example-inventory.sh formal | while IFS= read -r d; do
            .bin/machinery verify-formal --gen-only "$d" || exit 1
          done
      - name: Regenerate pack refinement proofs with Go
        run: |
          set -euo pipefail
          scripts/example-inventory.sh pack-children | while IFS=$'\t' read -r design parent; do
            test -n "$parent"
            .bin/machinery pack refine "$design"
          done
      - name: Assert clean tree
        run: |
          status=$(go run ./scripts/git-safe -root . -- status --porcelain)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::regeneration dirtied the tree (a stale tracked artifact or a newly emitted file)"
            exit 1
          fi

  # The golden corpus + full unit suite, on a cadence: the canary for
  # environment-driven divergence (Go toolchain updates changing output).
  golden-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit suite
        run: go test -count=1 ./...
      - name: Golden corpus
        run: go test -count=1 -run TestGolden ./cmd/machinery

  # Nightly govulncheck - catches newly-disclosed CVEs in dependencies between
  # PRs. Mirrors the security.yml job but on the schedule so we learn of a vuln
  # the day it's disclosed, not the next time someone opens a PR.
  vulncheck-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
      - name: Registered example implementation vulnerability scans
        run: |
          set -euo pipefail
          scripts/example-inventory.sh security | while IFS=$'\t' read -r impl module; do
            case "$module" in
              go) (cd "$impl" && govulncheck ./...) ;;
              *) echo "::error::unsupported security module type $module: $impl"; exit 1 ;;
            esac
          done

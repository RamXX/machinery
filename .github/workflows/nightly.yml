# nightly.yml - the deep, non-blocking checks that run once a day (or on
# manual dispatch). They do not block PRs; they surface drift on a cadence so
# it cannot accumulate silently.
name: nightly

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration-required:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - name: Required runtime integration
        run: |
          set -euo pipefail
          dagger call integration-evidence export --path="$RUNNER_TEMP/integration-required-evidence"
          cat "$RUNNER_TEMP/integration-required-evidence/console.txt"
          test "$(cat "$RUNNER_TEMP/integration-required-evidence/exit")" = 0

  # Regenerate every committed artifact with the pinned generators and prove
  # the tree is unchanged: the canary for a generator whose output drifted
  # from what is committed.
  regen-clean-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call regen-clean-tree

  # The golden corpus + full unit suite, on a cadence: the canary for
  # environment-driven divergence (Go toolchain updates changing output).
  # Full history is REQUIRED: the golden runs exercise the Ga acceptance gate,
  # which proves every reviewed commit is an ancestor of HEAD.
  golden-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call golden-nightly

  # Nightly govulncheck - catches newly-disclosed CVEs in dependencies between
  # PRs. The same function security.yml runs, on the schedule, so we learn of a
  # vuln the day it is disclosed rather than the next time someone opens a PR.
  vulncheck-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dagger
      - run: dagger call govulncheck

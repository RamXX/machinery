kind: DomainModel
version: v1
title: Checkout Split
description: >
  A deliberately small two-subsystem checkout: an orders service and a payments
  service coupled only through the bus. The worked example for recursive
  decomposition via contract packs.

glossary:
  Customer: "The person who places or cancels an order before payment settlement."
  Operator: "The fulfillment or payments operator authorized to ship or refund."
  System: "An authenticated subsystem event handler acting without a human surface."

enums:
  OrderStatus:
    values:
      - {name: Placed, definition: "Created; awaiting payment settlement."}
      - {name: Paid, definition: "Payment captured; may ship."}
      - {name: Shipped, definition: "Handed to the carrier; terminal."}
      - {name: Declined, definition: "Payment declined; terminal."}
      - {name: Cancelled, definition: "Cancelled before settlement; terminal."}
  PaymentStatus:
    values:
      - {name: Requested, definition: "Created from an order's payment request."}
      - {name: Captured, definition: "Funds taken."}
      - {name: Declined, definition: "Declined by the processor; terminal."}
      - {name: Refunded, definition: "Captured funds returned; terminal."}

entities:
  Order:
    definition: "A customer order in the orders subsystem."
    attributes:
      - {name: id, type: string}
      - {name: status, type: OrderStatus}
      - {name: total, type: number}
    actions:
      - {name: place, actor: Customer, preserves: [order-total-positive]}
      - {name: markPaid, actor: System}
      - {name: markDeclined, actor: System}
      - {name: ship, actor: Operator, preserves: [no-ship-without-capture]}
      - {name: cancel, actor: Customer}
    invariants:
      - {id: order-total-positive, statement: "An order's total is strictly positive."}
  Payment:
    definition: "A payment attempt in the payments subsystem."
    attributes:
      - {name: id, type: string}
      - {name: orderId, type: string}
      - {name: amount, type: number}
      - {name: status, type: PaymentStatus}
    actions:
      - {name: request, actor: System}
      - {name: capture, actor: System, preserves: [payment-single-capture]}
      - {name: decline, actor: System}
      - {name: refund, actor: Operator}
    invariants:
      - {id: payment-single-capture, statement: "A payment is captured at most once."}

invariants:
  - {id: no-ship-without-capture, statement: "An order ships only after its payment is captured. Cross-subsystem; enforcement is delegated to the orders subsystem, which may only reach Shipped from Paid, and Paid only on the payments subsystem's markPaid event."}

scenarios:
  - name: Positive order settles before shipment
    description: "Exercises creation validation and the capture-before-ship lifecycle rule."
    actors: [Customer, System, Operator]
    steps:
      - "A `Customer` places an `Order` with a strictly positive total."
      - "The payment `System` captures a `Payment` and marks the `Order` paid."
      - "An `Operator` ships the paid `Order`; an unpaid order would be rejected."
    invariants_touched: [order-total-positive, no-ship-without-capture]
  - name: Payment captures at most once
    description: "Exercises settlement, duplicate capture handling, and the refund path."
    actors: [System, Operator]
    steps:
      - "The order `System` requests a `Payment`."
      - "The processor `System` captures it once; a duplicate capture has no effect."
      - "An `Operator` refunds the captured `Payment`."
    invariants_touched: [payment-single-capture]

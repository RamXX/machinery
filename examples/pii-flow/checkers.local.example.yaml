# Sample local registry for `machinery verify-checkers`. Use it in place with
# --registry examples/pii-flow/checkers.local.example.yaml (input sources resolve
# against this file's directory), or copy it to <repo-root>/.machinery/
# checkers.local.yaml (git-ignored) together with the two inputs below.
#
# Docker is the local control plane only. All checker userspace, CPython for the
# adapter and Souffle 2.5 for the rules, comes from the exact OCI digest, built
# reproducibly from souffle-image/Dockerfile by scripts/pii-flow-image.sh. The
# adapter and rules are copied into read-only /checker mounts and their bytes are
# included in checker.runtime_closure.
checkers:
  pii-flow:
    runtime:
      kind: oci
      engine: [docker]
      image: localhost:5959/machinery/pii-flow-souffle@sha256:51981e17aef416020a1faa778042473a45dda347eab30cbbd9648a264f6f0df7
      platform: linux/amd64
      inputs:
        - {source: design/checkers/pii-flow/adapter.py, mount: adapter.py}
        - {source: design/checkers/pii-flow/rules.dl, mount: rules.dl}
    run: ["python3", "/checker/adapter.py", "run", "{projection}", "{config}", "{out}", "/checker/rules.dl"]
    verify: ["python3", "/checker/adapter.py", "verify", "{projection}", "{config}", "{out}", "/checker/rules.dl"]
    timeout: "120s"

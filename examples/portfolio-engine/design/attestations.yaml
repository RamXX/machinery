  - claim: g2.adoption-closure-discovery
    attestor: Codex deterministic design review
    date: 2026-09-02
    note: The in-process Python packages add no sidecar, operator, service, or stateful backend; the only runtime closure members are the declared market-data credential/provider and DuckDB file.
    covers:
      - path: ARCHITECTURE.md

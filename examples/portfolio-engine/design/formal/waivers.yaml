# Gc-carrier waiver annex: invariants no action, relational layer, machine
# unit, or external checker carries, each waived with where enforcement
# actually lands. A waiver is a disposition, not an escape: the reason names
# the artifact a reviewer can hold it to.
waivers:
  - invariant: run-forward-only
    reason: >-
      structural property of the RecommendationRun machine: its transition
      graph has no backward edge (Collecting -> Optimizing -> Ready/Failed),
      so no unit can violate it; the machine matrix and the M2 run-spine
      slice tests in BUILD/M1-run-pipeline.md are the enforcement artifacts
  - invariant: portfolio-size-16
    reason: >-
      optimizer-commit property; no modeled action owns the commit (the run
      machine commits internally); enforced by the locked property test
      PROP-portfolio-size-16 in BUILD/M3-optimizer.md
  - invariant: portfolio-holdings-deduped
    reason: >-
      optimizer-commit property; enforced by the locked property test
      PROP-portfolio-holdings-deduped in BUILD/M3-optimizer.md
  - invariant: portfolio-from-candidates
    reason: >-
      optimizer-commit property; enforced by the locked property test
      PROP-portfolio-from-candidates in BUILD/M3-optimizer.md
  - invariant: portfolio-has-drawdown
    reason: >-
      optimizer-commit property; enforced by the locked property test
      PROP-portfolio-has-drawdown in BUILD/M3-optimizer.md

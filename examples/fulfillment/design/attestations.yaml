  - claim: g2.interface-contract-rightness
    attestor: Codex production-readiness review
    date: 2026-09-02
    note: The only compile-time crossings are pure shared event schemas; all runtime service interaction is governed by the event contract, with explicit decode errors and retry-safe idempotency.
    covers:
      - path: ARCHITECTURE.md
        hash: sha256:87e209f0b7c243e7b07ff71b9e2c2ec4a04c1d6e7d7af2694368e879424daa4b
  - claim: g2.placement-rightness
    attestor: Codex production-readiness review
    date: 2026-09-02
    note: Stateful aggregates, saga, and outbox are placed with persistence and serialization matching their service ownership; value and CRUD records carry explicit no-machine or inline-placement reasons.
    covers:
      - path: ARCHITECTURE.md
        hash: sha256:87e209f0b7c243e7b07ff71b9e2c2ec4a04c1d6e7d7af2694368e879424daa4b
  - claim: g2.adoption-closure-discovery
    attestor: Codex production-readiness review
    date: 2026-09-02
    note: Elixir/OTP, Ecto, PostgreSQL, Oban, RabbitMQ, and the two external adapters were swept for separately operated closure members and bound to declared, mitigated dependencies.
    covers:
      - path: ARCHITECTURE.md
        hash: sha256:87e209f0b7c243e7b07ff71b9e2c2ec4a04c1d6e7d7af2694368e879424daa4b
  - claim: g2.event-contract-completeness
    attestor: Codex production-readiness review
    date: 2026-09-02
    note: The reserve, release, capture, refund, dispatch, and reply flows were swept in both producer and consumer directions; order placement remains an explicitly local API-to-saga call.
    covers:
